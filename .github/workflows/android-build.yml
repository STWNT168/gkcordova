name: Android APK Build

on:
  push:
    branches:
      - main
      - master
      - upgrade/cordova-android-gradle9
  pull_request:
    branches:
      - main
      - master

env:
  ANDROID_SDK_ROOT: ${{ runner.tool_cache }}/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -qO /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-*.zip || true
          # If the above wildcard fails on runner, download a known release:
          if [ ! -f /tmp/cmdline-tools.zip ]; then
            wget -qO /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          fi
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ || true
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root=${ANDROID_SDK_ROOT} --licenses || true
          sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          npm ci
          npx cordova telemetry off

      - name: Ensure android platform (upgrade to latest)
        run: |
          npx cordova platform rm android || true
          npx cordova platform add android@latest --save

      - name: Build Android debug APK
        run: |
          npx cordova build android --debug --stacktrace

      - name: Find APK
        id: find-apk
        run: |
          set -eux
          APK_PATHS=(
            "platforms/android/app/build/outputs/apk/debug/app-debug.apk"
            "platforms/android/build/outputs/apk/debug/android-debug.apk"
            "platforms/android/bin/*.apk"
          )
          FOUND=""
          for p in "${APK_PATHS[@]}"; do
            matches=( $p )
            for m in "${matches[@]}"; do
              if [ -f "$m" ]; then
                FOUND="$m"
                break 2
              fi
            done
          done
          if [ -z "$FOUND" ]; then
            echo "No APK found; listing directories for debugging"
            find platforms/android -maxdepth 6 -type f -name "*.apk" -print || true
            exit 1
          fi
          echo "Found APK: $FOUND"
          echo "apk=$FOUND" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gkcordova-apk
          path: ${{ steps.find-apk.outputs.apk }}
